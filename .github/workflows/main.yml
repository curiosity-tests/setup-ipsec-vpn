name: build

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: [master]
    paths:
      - '**.sh'
      - '.github/workflows/main.yml'
      - '.github/workflows/shellcheck.yml'
      - '.github/workflows/test_set_1.yml'
      - '.github/workflows/test_set_2.yml'

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "build ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  shellcheck:
    # racecar: the upstream guard pins this job to the canonical repo, so on a
    # fork it skips and the run reports success having executed nothing. Our
    # fork is added as an ADDITIONAL allowed repo -- the upstream clause is
    # left intact, and nothing here publishes, deploys, pushes or uses secrets.
    # test_set_1/test_set_2 only `needs: shellcheck`, so they cascade-skipped
    # off this one gate; un-gating here restores all three jobs.
    if: github.repository_owner == 'hwdsl2' || github.repository_owner == 'curiosity-tests'
    uses: ./.github/workflows/shellcheck.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}

  test_set_1:
    needs: shellcheck
    uses: ./.github/workflows/test_set_1.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}

  test_set_2:
    needs: shellcheck
    uses: ./.github/workflows/test_set_2.yml
    with:
      chalk_on: ${{ inputs.leg == 'instrumented' && 'true' || 'false' }}
      profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
